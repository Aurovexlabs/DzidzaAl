name: ci

on:
  push:
  pull_request:

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-syntax
      - frontend-build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend worker frontend
