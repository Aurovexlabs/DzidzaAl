services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
      - qdrant
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/dzidzaai
      REDIS_URL: redis://redis:6379
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: dzidzaai_document_chunks
      CLIENT_URL: http://localhost:8080
      COOKIE_SAME_SITE: lax
      UPLOAD_MAX_SIZE_MB: 10
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:5000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - backend
      - redis
      - mongo
      - qdrant
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/dzidzaai
      REDIS_URL: redis://redis:6379
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: dzidzaai_document_chunks
      CLIENT_URL: http://localhost:8080
      COOKIE_SAME_SITE: lax
      UPLOAD_MAX_SIZE_MB: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE_URL: /api

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
